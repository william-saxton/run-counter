name: Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for the release (e.g. v0.1.0). Leave blank to derive from package.json + commit sha."
        required: false
        type: string
      prerelease:
        description: "Mark this release as a pre-release"
        required: false
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo registry and build
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux build dependencies
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tauri binary (no installer)
        run: npm run tauri -- build --no-bundle

      - name: Stage binary for release
        shell: bash
        run: |
          mkdir -p artifacts
          case "${{ matrix.platform }}" in
            windows-latest)
              cp src-tauri/target/release/run-counter.exe artifacts/run-counter-windows-x86_64.exe
              ;;
            macos-latest)
              cp src-tauri/target/release/run-counter artifacts/run-counter-macos
              chmod +x artifacts/run-counter-macos
              ;;
            ubuntu-latest)
              cp src-tauri/target/release/run-counter artifacts/run-counter-linux-x86_64
              chmod +x artifacts/run-counter-linux-x86_64
              ;;
          esac

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: run-counter-${{ matrix.platform }}
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: resolve_tag
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ inputs.tag_name }}" ]; then
            tag="${{ inputs.tag_name }}"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            tag="pr-${{ github.event.pull_request.number }}-$(echo ${{ github.sha }} | cut -c1-7)"
          else
            # Auto-bump scheme: v{MAJOR}.{MINOR}.
            #   MAJOR comes from package.json's version field. Bump the file
            #   to start a new major line.
            #   MINOR auto-increments past the highest existing v{MAJOR}.{N}
            #   release tag. The MINOR in package.json acts as a floor — set
            #   it higher than the latest release if you want to skip ahead.
            file_version=$(node -p "require('./package.json').version")
            major=$(echo "$file_version" | cut -d. -f1)
            file_minor=$(echo "$file_version" | cut -d. -f2)
            file_minor=${file_minor:-0}

            existing=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
              | grep -E "^v${major}\.[0-9]+$" || true)
            latest_minor=$(echo "$existing" \
              | sed -E "s/^v${major}\.([0-9]+)$/\1/" \
              | sort -n \
              | tail -1)

            if [ -z "$latest_minor" ]; then
              next_minor=$file_minor
            else
              candidate=$((latest_minor + 1))
              if [ "$candidate" -lt "$file_minor" ]; then
                next_minor=$file_minor
              else
                next_minor=$candidate
              fi
            fi
            tag="v${major}.${next_minor}"
            echo "Auto-bump → major=${major}, file_minor=${file_minor}, latest_minor=${latest_minor:-none}, next=${next_minor}"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Resolve prerelease flag
        id: resolve_prerelease
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "prerelease=${{ inputs.prerelease }}" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: List release assets
        run: ls -la release-assets

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.resolve_tag.outputs.tag }}
          name: "Run Counter ${{ steps.resolve_tag.outputs.tag }}"
          body: |
            Automated release built from `${{ github.sha }}`.
            Triggered by: `${{ github.event_name }}`.

            Standalone binaries — no installer required. Download the file for your platform and run it directly.
          prerelease: ${{ steps.resolve_prerelease.outputs.prerelease }}
          files: release-assets/*
          fail_on_unmatched_files: true
